name: itvlist

on:
  workflow_dispatch:
  schedule:
    # UTC 21:00 = 北京时间次日 05:00
    - cron: '0 21 * * *'
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: itvlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.19.0 requests==2.31.0 eventlet==0.36.1 aiohttp aiofiles

      - name: Run cctv
        run: python new.py

      # - name: Run weishi
      #   run: python weishi.py

      # - name: Run qita
      #   run: python qita.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.txt'

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update generated files [skip ci]"
          git pull --rebase
          git push
