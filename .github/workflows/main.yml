name: itvlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 21 * * *'
  push:
    branches:
      - main
    paths:
      - '**.py'
      - '.github/workflows/**'

permissions:
  contents: write

concurrency:
  group: itvlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 删掉了 cache: 'pip'，因为仓库里没有 requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium==4.19.0 requests==2.31.0 aiohttp aiofiles

      - name: Run cctv
        run: python new.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- '*.txt'

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update generated files [skip ci]"
          git pull --rebase
          git push
